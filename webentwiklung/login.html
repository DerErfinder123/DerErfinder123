<!DOCTYPE html>

<html>

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="styles.css">
    <title>Chat</title>
</head>

<body class="mitte">
    <div class="text-links">
        <h1>Login</h1>
        <p>Hier kannst du dich mit Namen und Passwort einlogen.</p>
        <div class="m-t-15 m-b-15">


            <label>Name:</label>
            <input id="name">
        </div>
        <div class="m-t-15 m-b-15">
            <label>Passwort:</label>
            <input id="passwort">
        </div>
        <div>
            <button class= "button hintergrund-blau" onclick="login()">Login</button>
            <span id="meldung"></span>
        </div>
    </div>
    <audio autoplay>
        <source src="musik.mp3" type="audio/mpeg">
    </audio>
    <script>
        const meldungSpan =document.getElementById("meldung")
        function login(){
            const name = document.getElementById("name").value;
            const passwort =document.getElementById("passwort").value;
            if (passwort = localStorage.getItem(name)){
                window.location.href = "intern.html"
            }

            else{
                meldungSpan.innerText = "Name oder Passwort falsch"
                meldungSpan.style.color = "#F17A7C"
            }
        }
    </script>
</body>

</html>
