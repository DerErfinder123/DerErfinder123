<!DOCTYPE html>

<html>

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="styles.css">
    <title>Chat</title>
</head>

<body class="mitte">
    <div class="text-links">
        <h1>Registrieren</h1>
        <p>Hier kannst du dich mit Namen und Passwort registrieren.</p>
        <div class="m-t-15 m-b-15">


            <label>Name:</label>
            <input id="name">
        </div>
        <div class="m-t-15 m-b-15">
            <label>Passwort:</label>
            <input id="passwort">
        </div>
        <div>
            <button class= "button hintergrund-blau" onclick="registrieren()">Registrieren</button>
        </div>
    </div>
    <audio autoplay>
        <source src="musik.mp3" type="audio/mpeg">
    </audio>
    <script>
        function registrieren(){
            const name = document.getElementById("name")
            const passwort =document.getElementById("passwort")
            if (name in localStorage){
                alert("name schon vergeben")
            }

            else{
                localStorage.setItem(name, passwort)
                alert("sucsesful")
            }
        }
    </script>
</body>

</html>
